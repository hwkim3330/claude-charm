<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Charm</title>
<meta name="description" content="A pocket AI companion you tap to talk to — an unofficial, Claude-flavoured take on the Muse Charm idea.">
<meta name="theme-color" content="#1b1917">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Permanent+Marker&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<main class="stage">
  <header class="top">
    <h1>Claude Charm <span class="badge" id="brain-badge"></span></h1>
    <button class="icon-btn" id="btn-settings" aria-label="설정" data-i18n-aria="settings">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.58-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.49.49 0 0 0 .12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.65.07.97l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1c.22.08.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65Z"/></svg>
    </button>
  </header>

  <!-- the charm itself -->
  <section class="charm-wrap">
    <div class="ring" aria-hidden="true"></div>
    <div class="charm" id="charm">
      <div class="screen" id="screen">
        <canvas id="out" width="560" height="560" aria-label="Clawd"></canvas>
        <div class="bubble" id="bubble" hidden></div>
        <div class="status" id="status"></div>
      </div>
      <button class="sensor" id="sensor" aria-label="눌러서 말하기">
        <svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M11 17a9 9 0 0 1 18 0"/><path d="M14 21v-3a6 6 0 0 1 12 0v4"/><path d="M17 27v-9a3 3 0 0 1 6 0v6"/><path d="M20 18v12"/><path d="M26 26v2"/><path d="M11 22v2"/>
        </g></svg>
      </button>
    </div>
  </section>

  <p class="hint" id="hint"></p>
  <div class="offer" id="offer" hidden>
    <span id="offer-text"></span>
    <span class="offer-actions"><button type="button" class="primary small" id="offer-yes"></button><button type="button" class="link" id="offer-no"></button></span>
  </div>

  <form class="talk" id="talk" autocomplete="off">
    <input id="text" type="text" enterkeyhint="send">
    <button type="submit" class="send" aria-label="send">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.39 10.1 16 12 3.39 13.9z"/></svg>
    </button>
  </form>

  <details class="log">
    <summary data-i18n="log">대화 기록</summary>
    <ol id="log"></ol>
    <button type="button" class="link" id="btn-forget" data-i18n="forget">기억 지우기</button>
  </details>

  <footer class="foot" data-i18n-html="foot"></footer>
</main>

<!-- settings sheet -->
<dialog id="settings">
  <form method="dialog" class="sheet">
    <h2 data-i18n="settings">설정</h2>

    <fieldset>
      <legend data-i18n="companion">친구</legend>
      <label><span data-i18n="name">이름</span><input id="s-name" maxlength="16"></label>
      <div class="field">
        <span data-i18n="avatar">모자</span>
        <div class="skins" id="s-hats"></div>
      </div>
      <div class="field">
        <span data-i18n="color">색</span>
        <div class="swatches" id="s-colors"></div>
      </div>
      <label><span data-i18n="persona">성격</span><textarea id="s-persona" rows="3"></textarea></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="voice">목소리</legend>
      <label><span data-i18n="lang">언어</span>
        <select id="s-lang"><option value="ko-KR">한국어</option><option value="en-US">English</option><option value="ja-JP">日本語</option></select>
      </label>
      <label><span data-i18n="voiceName">음성</span><select id="s-voice"></select></label>
      <label><span data-i18n="rate">빠르기</span><input id="s-rate" type="range" min="0.6" max="1.6" step="0.05"></label>
      <label><span data-i18n="pitch">높낮이</span><input id="s-pitch" type="range" min="0.5" max="2" step="0.05"></label>
      <label class="check"><input id="s-speak" type="checkbox"><span data-i18n="speakAloud">소리 내어 대답</span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="brain">두뇌</legend>
      <label><span data-i18n="brainMode">누가 대답할까</span><select id="s-brain"></select></label>
      <p class="note" id="brain-info"></p>
      <button type="button" class="primary" id="btn-local"></button>
      <progress id="local-bar" max="1" value="0" hidden></progress>
    </fieldset>

    <fieldset>
      <legend>Claude API</legend>
      <label><span data-i18n="key">API 키</span><input id="s-key" type="password" placeholder="sk-ant-…" autocomplete="off" spellcheck="false"></label>
      <p class="note" data-i18n="keyNote">키는 이 브라우저에만 저장되고 api.anthropic.com 으로 직접 보내집니다.</p>
      <label><span data-i18n="model">모델</span>
        <select id="s-model">
          <option value="claude-opus-5">Claude Opus 5</option>
          <option value="claude-sonnet-5">Claude Sonnet 5</option>
          <option value="claude-haiku-4-5">Claude Haiku 4.5</option>
        </select>
      </label>
    </fieldset>

    <div class="sheet-actions">
      <button value="close" class="primary" data-i18n="done">완료</button>
    </div>
  </form>
</dialog>

<!-- the painted screen: p5.js + p5.brush and the vendored Claude Animation Base (MIT) -->
<script>
  // Screen resolution: ?res= wins, then what this device settled on last time (see charm-scene.js), then 560.
  const RES = (() => { let r = +new URLSearchParams(location.search).get('res'); if (!r) { try { r = +localStorage.getItem('charm.res'); } catch {} } return Math.max(320, Math.min(800, r || 560)); })();
  const PROJECT = { w: RES, h: RES, bpm: 100, offset: 0, duration: 1e9 };
</script>
<script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/p5.brush@2.2.3/dist/p5.brush.js"></script>
<script src="vendor/claude-animation-base/core.js"></script>
<script src="vendor/claude-animation-base/clawd.js"></script>
<script src="charm-scene.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
